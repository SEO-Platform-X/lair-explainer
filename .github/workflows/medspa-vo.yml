name: Medspa VO
on: { push: { branches: [medspa-vo, ps-vo, eye-vo, disp-vo] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  vo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: github.ref_name != 'disp-vo'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 ${{ github.ref_name == 'disp-vo' && 'disp_vo.py' || 'medspa_vo.py' }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      - if: github.ref_name == 'disp-vo'
        run: pip install -q faster-whisper && python3 transcribe.py
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-${{ github.run_number }}
          name: Explainer VO ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.ref_name }}
          files: out/*
